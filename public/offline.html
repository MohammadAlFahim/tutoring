<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Study Assistant</title>
    <style>
      :root { color-scheme: light; }
      * { margin: 0; box-sizing: border-box; }
      body {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        text-align: center;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        background: #f9fafb;
        color: #111827;
      }
      img { width: 64px; height: 64px; border-radius: 14px; }
      h1 { font-size: 18px; font-weight: 600; }
      p { max-width: 22rem; font-size: 14px; color: #6b7280; }
      button {
        margin-top: 8px;
        border: 0;
        border-radius: 10px;
        background: #4f46e5;
        color: #fff;
        font-size: 15px;
        font-weight: 500;
        padding: 10px 18px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>
      The study assistant needs an internet connection to answer questions and
      run quizzes. Reconnect and try again.
    </p>
    <button onclick="location.reload()">Retry</button>
  </body>
</html>
